<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a7fd0">
<meta name="robots" content="noindex, nofollow">
<title>她写的话</title>
<style>
  :root{ --ink:#2b3440; --soft:#78889b; --line:#e3e9f1; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; padding:16px 14px calc(28px + env(safe-area-inset-bottom));
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:#f4f7fb; color:var(--ink); line-height:1.75;
  }
  .wrap{max-width:560px; margin:0 auto}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  h1{font-size:19px; margin:0}
  .badge{font-size:12px; color:#fff; background:linear-gradient(135deg,#7fb0ea,#4a7fd0);
    padding:5px 11px; border-radius:999px; white-space:nowrap}
  .bar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
  .bar button{
    flex:1; min-width:104px; border:1px solid var(--line); background:#fff; color:var(--ink);
    font-size:13.5px; padding:10px 12px; border-radius:12px; cursor:pointer;
  }
  .bar button:active{background:#eef4fb}
  .status{font-size:12.5px; color:var(--soft); margin-bottom:12px; text-align:center}
  .msg{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;
    box-shadow:0 2px 8px rgba(74,127,208,.06)}
  .msg .head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px}
  .msg .t{font-size:13px; color:#4a7fd0; font-weight:700}
  .msg .time{font-size:11.5px; color:var(--soft); white-space:nowrap}
  .msg .body{font-size:15px; white-space:pre-wrap; word-break:break-word}
  .empty{text-align:center; color:var(--soft); font-size:14px; padding:40px 10px; line-height:2}
  .note{font-size:12px; color:var(--soft); text-align:center; margin-top:18px; line-height:1.9}
  .tag{display:inline-block; font-size:11px; color:#a06a00; background:#fff3d6; border-radius:6px; padding:1px 6px; margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>她写的话</h1>
    <span class="badge" id="days">在一起第 — 天</span>
  </header>

  <div class="bar">
    <button id="refresh">刷新</button>
    <button id="export">导出全部文字</button>
    <button id="clear">清空本机存档</button>
  </div>

  <div class="status" id="status">正在读取…</div>
  <div id="list"></div>

  <div class="note">
    这个页面每 15 秒自动刷新。<br>
    服务器只保留最近 12 小时的消息，但<b>你打开过的都会存进这台手机的本地存档</b>，不会丢。
  </div>
</div>

<script>
/* ================= 配置 ================= */
const NTFY_TOPIC = 'jxy-love-2c2d8f7e9f5d';
const NTFY = 'https://ntfy.sh/' + NTFY_TOPIC;
const ARCHIVE_KEY = 'jxy_archive_v1';
const START = new Date(2026, 7, 30);      // 在一起的第一天

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const fmt = (ts) => {
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};

/* 顶部天数 */
(function () {
  const a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  const n = new Date();
  const b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  $('days').textContent = '在一起第 ' + (Math.floor((b - a) / 86400000) + 1) + ' 天';
})();

/* 本地存档 */
function loadArchive() {
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); } catch (e) { return []; }
}
function saveArchive(arr) {
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr.slice(0, 500))); } catch (e) { }
}
function mergeArchive(list) {
  const have = loadArchive();
  const seen = new Set(have.map((m) => m.id));
  let added = 0;
  list.forEach((m) => { if (!seen.has(m.id)) { have.push(m); seen.add(m.id); added++; } });
  have.sort((x, y) => y.time - x.time);
  saveArchive(have);
  return added;
}

function render(list, added, err) {
  const box = $('list');
  box.innerHTML = '';
  if (err) {
    $('status').innerHTML = '读取失败：' + err + '（已显示本机存档）';
  } else {
    $('status').innerHTML = '共 ' + list.length + ' 条'
      + (added ? '，本次新增 <b>' + added + '</b> 条' : '')
      + ' · 最后更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有收到留言<br>她在小站里写完点“发给他”，这里就会出现</div>';
    return;
  }
  list.forEach((m) => {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="head"><span class="t">' + (m.title || '留言') + '</span>'
      + '<span class="time">' + fmt(m.time) + '</span></div>'
      + '<div class="body"></div>';
    div.querySelector('.body').textContent = m.message || '';
    box.appendChild(div);
  });
}

async function fetchNotes() {
  let remote = [], err = '';
  try {
    const r = await fetch(NTFY + '/json?poll=1&since=all', { cache: 'no-store' });
    if (r.ok) {
      const raw = await r.text();
      remote = raw.split('\n').filter((l) => l.trim()).map((l) => {
        try { return JSON.parse(l); } catch (e) { return null; }
      }).filter((m) => m && m.event === 'message');
    } else {
      err = 'HTTP ' + r.status;
    }
  } catch (e) {
    err = '网络不可达';
  }
  const added = remote.length ? mergeArchive(remote) : 0;
  render(loadArchive(), added, err);
}

$('refresh').addEventListener('click', fetchNotes);

$('export').addEventListener('click', function () {
  const list = loadArchive();
  if (!list.length) return;
  let s = '她写的话（导出时间 ' + new Date().toLocaleString('zh-CN') + '）\n';
  list.slice().reverse().forEach((m) => { s += '\n=== ' + fmt(m.time) + ' ===\n' + (m.message || '') + '\n'; });
  const tmp = document.createElement('textarea');
  tmp.value = s; tmp.style.position = 'fixed'; tmp.style.opacity = '0';
  document.body.appendChild(tmp); tmp.select();
  try { document.execCommand('copy'); } catch (e) { }
  tmp.remove();
  $('status').innerHTML = '已复制全部留言到剪贴板（' + list.length + ' 条）';
});

$('clear').addEventListener('click', function () {
  if (!confirm('确定清空这台手机上的留言存档？')) return;
  try { localStorage.removeItem(ARCHIVE_KEY); } catch (e) { }
  render([], 0, '');
});

fetchNotes();
setInterval(fetchNotes, 15000);
</script>
</body>
</html>
