<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec4">
<meta name="robots" content="noindex, nofollow">
<title>江鑫颖姐姐的专属空间</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="专属空间">
<script>
/* 每次进入（打开/刷新）都必须重新输入密码，不记住解锁状态 */
(function () {
  try { localStorage.removeItem('jxy_unlocked'); } catch (e) { }   // 清掉以前遗留的"记住解锁"标记
})();
</script>
<style>
  :root{
    --pink:#ff8fb8; --pink-deep:#ff5f9e; --pink-soft:#ffe6f0;
    --ink:#5a3a47; --ink-soft:#8b6b78; --card:#fffffff0; --line:#ffd7e6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(175deg,#ffeaf3 0%,#ffe1ee 45%,#fff1f7 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding:12px 12px calc(86px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .floaty{position:fixed;top:-40px;font-size:18px;opacity:.6;pointer-events:none;animation:fall linear infinite;z-index:0}
  @keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:.75}100%{transform:translateY(115vh) rotate(320deg);opacity:0}}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto}

  /* ===== 顶部标题 ===== */
  .top-title{
    text-align:center; margin:4px 0 10px;
    font-size:18px; font-weight:800; color:var(--pink-deep);
    letter-spacing:1px; text-shadow:0 2px 0 #fff;
  }
  .top-title small{display:block;font-size:11.5px;font-weight:600;color:#c58fa6;letter-spacing:0;margin-top:3px}

  /* ===== 天数 ===== */
  .days-badge{
    text-align:center; background:linear-gradient(135deg,#ff9ec4,#ff6aa6); color:#fff;
    border-radius:24px; padding:14px 16px 16px; margin-bottom:12px;
    box-shadow:0 10px 24px rgba(255,110,165,.34), inset 0 -3px 0 rgba(255,255,255,.32);
    position:relative; overflow:hidden;
  }
  .days-badge::after{content:"";position:absolute;top:-60%;left:-30%;width:80%;height:200%;
    background:linear-gradient(90deg,#ffffff00,#ffffff55,#ffffff00);transform:rotate(18deg);animation:shine 4.5s ease-in-out infinite}
  @keyframes shine{0%,60%{left:-40%}100%{left:120%}}
  .days-line{font-size:14px;opacity:.95}
  .days-num{font-size:52px;line-height:1.05;font-weight:800;text-shadow:0 4px 0 rgba(190,60,110,.3);display:inline-block}
  .days-unit{font-size:18px;font-weight:700;margin-left:4px}
  .days-sub{font-size:12px;opacity:.92;margin-top:4px}

  /* ===== 卡片 ===== */
  .card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 6px 16px rgba(255,140,180,.15);margin-bottom:12px}
  .card .k{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .quote{font-size:15px;font-weight:600;line-height:1.8}
  /* 常驻情话卡片 */
  .card.pinned{background:linear-gradient(135deg,#fff3f9,#ffe4f0);border:2px solid #ffd0e2}
  .pinned-text{
    font-size:20px; font-weight:800; color:var(--pink-deep); text-align:center;
    letter-spacing:.5px; line-height:1.7; padding:6px 0 2px;
    text-shadow:0 1px 0 #fff;
  }
  .row{display:flex;gap:10px;align-items:center}
  .row .col{flex:1; min-width:0}
  .btn{min-width:0}

  /* ===== 爱心/按钮 ===== */
  .hearts{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#e8437a}
  .btn{
    border:none;cursor:pointer;color:#fff;font-weight:800;font-size:14.5px;
    background:linear-gradient(135deg,#ff9ec4,#ff5f9e);border-radius:16px;padding:12px 10px;
    box-shadow:0 8px 18px rgba(255,95,158,.3);transition:transform .12s;width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:2px solid var(--line);box-shadow:none}
  .btn.small{font-size:13px;padding:10px 6px;border-radius:13px}
  .btn:disabled{opacity:.55}

  /* ===== 输入 ===== */
  textarea,input[type=text]{
    width:100%;border:1px solid var(--line);background:#fffafd;border-radius:14px;
    padding:11px 12px;font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);outline:none;resize:vertical;
  }
  textarea::placeholder,input::placeholder{color:#cfa9ba}
  label.lb{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 5px;font-weight:600}

  /* ===== 心情：5 个心情按钮 ===== */
  .moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .moods button{
    border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;
    font-size:10.5px;color:var(--ink-soft);font-weight:700;cursor:pointer;line-height:1.45;
    transition:transform .14s,border-color .14s,background .14s;font-family:inherit;
  }
  .moods button .e{display:block;font-size:22px;margin-bottom:2px;transition:transform .18s}
  .moods button:active{transform:scale(.94)}
  .moods button.on{background:linear-gradient(135deg,#fff2f9,#ffe4f0);border-color:var(--pink);color:var(--pink-deep)}
  .moods button.on .e{transform:scale(1.25) rotate(-6deg)}
  .mood-strip{display:flex;gap:5px;overflow-x:auto;padding:2px 0 2px}
  .mood-strip::-webkit-scrollbar{height:0}
  .mood-day{flex:0 0 auto;width:42px;text-align:center}
  .mood-day .d{font-size:10.5px;color:#a9bccb}
  .mood-day .e{font-size:24px;line-height:1.4;display:block}
  .mood-day .e.empty{opacity:.25;font-size:20px}
  .mood-day .b{height:4px;border-radius:3px;background:#ffe4f0;margin-top:2px;overflow:hidden}
  .mood-day .b i{display:block;height:100%;border-radius:3px}
  .mood-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:9px;background:#fff0f7;color:#e2568c}
  .mood-day.today .d{color:#e2568c;font-weight:800}
  /* 心情月历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 9px}
  .cal-head button{
    width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;
    color:var(--pink-deep);font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;line-height:1;
  }
  .cal-head button:active{transform:scale(.92)}
  .cal-head button:disabled{opacity:.3}
  .cal-title{font-size:13.5px;font-weight:800;color:var(--pink-deep)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#b39aa6;margin-bottom:5px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-day{
    height:46px;border-radius:11px;background:#fffdfe;border:1.5px solid #f3e8ef;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s,background .15s,border-color .15s;
  }
  .cal-day:active{transform:scale(.93)}
  .cal-day .n{font-size:11px;color:#a9bccb;line-height:1.1}
  .cal-day .e{font-size:17px;line-height:1.25}
  .cal-day.blank{background:transparent;border-color:transparent;cursor:default}
  .cal-day.has{border-color:#ffd7e6;background:linear-gradient(135deg,#fffafd,#fff2f8)}
  .cal-day.today{border-color:var(--pink);box-shadow:inset 0 0 0 2px #ffe4f0}
  .cal-day.sel{background:linear-gradient(135deg,#ffe9f3,#ffd9ea);border-color:var(--pink-deep)}
  .cal-detail{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.7;min-height:18px}

  /* ===== 列表项 ===== */
  .item{background:#fffdfe;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .item .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .item .t{font-weight:700;font-size:14px}
  .item .time{font-size:11.5px;color:#c58fa6;white-space:nowrap}
  .item .b{font-size:14px;white-space:pre-wrap;line-height:1.75;color:#6b4a58}
  .item .need{font-size:13px;color:#a2607f;background:#fff3f8;border-radius:10px;padding:7px 10px;margin-top:7px;line-height:1.7}
  .muted{font-size:12.5px;color:#bb92a4;text-align:center;padding:16px 6px;line-height:1.9}

  /* ===== 桌宠 ===== */
  .pet-area{
    position:relative;height:342px;border-radius:20px;overflow:hidden;margin-bottom:12px;
    background:linear-gradient(180deg,#fff6fb 0%,#ffe9f3 70%,#ffe0ee 100%);
    border:2px solid var(--line);
  }
  .pet-area .floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,#ffe0ee,#ffd0e4);z-index:1}
  .pet-wrap{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:212px;height:226px;z-index:2}
  /* 两层包裹：petAnim 负责待机呼吸/左右轻摆，petAct 负责点击、吃东西、拉屎等一次性动作 */
  .pet-anim,.pet-act{position:relative;width:100%;height:100%;transform-origin:50% 92%}
  .pet-anim{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{transform:scale(1,1) translateY(0)}
    50%{transform:scale(1.018,1.035) translateY(-2px)}
  }
  .pet-act.act-hop{animation:actHop .62s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes actHop{
    0%{transform:translateY(0) scale(1,1)}
    22%{transform:translateY(2px) scale(1.06,.9)}
    55%{transform:translateY(-20px) scale(.97,1.05)}
    78%{transform:translateY(3px) scale(1.05,.93)}
    100%{transform:translateY(0) scale(1,1)}
  }
  .pet-act.act-squash{animation:actSquash .5s ease both}
  @keyframes actSquash{
    0%{transform:scale(1,1)}
    30%{transform:scale(1.12,.86) translateY(4px)}
    62%{transform:scale(.95,1.07) translateY(-4px)}
    100%{transform:scale(1,1)}
  }
  .pet-act.act-chew{animation:actChew .62s ease-in-out both}
  @keyframes actChew{
    0%,100%{transform:scale(1,1)}
    20%,60%{transform:scale(1.07,.93) translateY(2px)}
    40%,80%{transform:scale(.97,1.04) translateY(-2px)}
  }
  .pet-act.act-squat{animation:actSquat 1.15s ease both}
  @keyframes actSquat{
    0%{transform:scale(1,1) translateY(0)}
    18%,72%{transform:scale(1.1,.86) translateY(8px)}
    100%{transform:scale(1,1) translateY(0)}
  }
  .pet-act.act-shake{animation:actShake .42s ease both}
  @keyframes actShake{
    0%,100%{transform:rotate(0)}
    25%{transform:rotate(-3.2deg)}
    60%{transform:rotate(3.2deg)}
  }
  .pet-act.act-relieved{animation:actRelieved .8s ease both}
  @keyframes actRelieved{
    0%{transform:scale(1,.9) translateY(6px)}
    45%{transform:scale(.97,1.06) translateY(-10px)}
    100%{transform:scale(1,1) translateY(0)}
  }
  .pet-anim.sleeping{animation:breathe 5.4s ease-in-out infinite;filter:saturate(.92)}
  /* 眨眼：两块肤色椭圆盖在眼睛上，定时闪一下 */
  .eyelid{
    position:absolute;background:#f9f4d6;border-radius:50%;opacity:0;
    transform:scaleY(0);transform-origin:50% 0;
    animation:blink 5.6s infinite;
  }
  #eyeL{left:31%;top:43.5%;width:11%;height:9.5%;animation-delay:.2s}
  #eyeR{left:58.8%;top:43.7%;width:11.7%;height:10%;animation-delay:.2s}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(0);opacity:0}
    94%{transform:scaleY(1);opacity:1}
    96%{transform:scaleY(1);opacity:1}
    98%{transform:scaleY(0);opacity:0}
  }
  /* 特效层（爱心、胡萝卜、便便、星星） */
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .fx i{position:absolute;font-style:normal;font-size:20px;transition:transform 1s ease-out,opacity 1s ease-out}
  .fx i.pop{animation:fxPop .9s ease both}
  @keyframes fxPop{0%{transform:translateY(0) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-46px) scale(1.15);opacity:0}}
  .pet-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(200,120,160,.25))}
  /* 换装图层(emoji 浮层)：位置按兔子身体比例调过 */
  .lay{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;line-height:1}
  .lay.hat{top:52px;font-size:34px}
  .lay.glasses{top:96px;font-size:30px}
  .lay.clothes{top:148px;font-size:46px}
  .lay.deco{top:128px;font-size:30px;left:auto;right:0;transform:none}
  #petSvg{width:100%;height:100%}
  #petSvg svg,#petSvg img{width:100%;height:100%;display:block;object-fit:contain}
  .poops{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:10px;font-size:24px;z-index:3}
  .poop{animation:pop .4s ease both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .bubble{
    position:absolute;left:50%;transform:translateX(-50%);top:8px;max-width:88%;z-index:6;
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;
    font-size:13px;line-height:1.6;box-shadow:0 4px 12px rgba(255,140,180,.2);
  }
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--line)}
  @keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .bars{display:flex;gap:10px;margin-bottom:10px}
  .bar-box{flex:1;background:#fff;border-radius:14px;padding:9px 11px;border:1px solid var(--line)}
  .bar-box .n{font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:5px}
  .bar-bg{height:8px;background:#ffe6f0;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb3d1,#ff5f9e);transition:width .3s}
  .bar-fill.green{background:linear-gradient(90deg,#a8e6a3,#4cc76a)}

  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .shop-item{
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;
  }
  .shop-item.owned{border-color:#b8e6c2;background:#f4fff7}
  .shop-item.on{border-color:var(--pink);background:#fff0f6;box-shadow:0 4px 12px rgba(255,120,170,.25)}
  .shop-item .e{font-size:26px}
  .shop-item .nm{font-size:11.5px;margin-top:3px;color:var(--ink)}
  .shop-item .pr{font-size:11px;color:#e8437a;font-weight:700;margin-top:2px}
  .shop-item.owned .pr{color:#4cc76a}

  /* ===== 游戏弹窗 ===== */
  .modal{position:fixed;inset:0;background:rgba(90,58,71,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.on{display:flex}
  .modal-card{background:#fff;border-radius:20px;padding:18px;max-width:360px;width:100%;text-align:center}
  .modal-card h3{margin:0 0 6px;font-size:17px}
  .modal-card p{margin:0 0 12px;font-size:13px;color:var(--ink-soft);line-height:1.7}
  .rps{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
  .rps button{font-size:30px;background:#fff5fa;border:2px solid var(--line);border-radius:16px;padding:8px 12px;cursor:pointer}
  .rps button:active{transform:scale(.95)}
  .game-res{font-size:15px;font-weight:700;min-height:24px;margin:10px 0 4px;color:var(--pink-deep)}

  /* ===== 底部导航 ===== */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;background:#fffffff5;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .tabbar button{
    flex:1;border:none;background:none;cursor:pointer;padding:6px 2px;border-radius:14px;
    font-family:inherit;color:#b58ba0;font-size:11px;font-weight:700;line-height:1.35;
  }
  .tabbar button .e{display:block;font-size:21px;margin-bottom:1px;filter:grayscale(.35);opacity:.75}
  .tabbar button.on{color:var(--pink-deep);background:#fff0f6}
  .tabbar button.on .e{filter:none;opacity:1;transform:scale(1.06)}
  .view{display:none}
  .view.on{display:block}

  /* ===== 背景音乐按钮 ===== */
  .music-btn{
    position:fixed; z-index:45; cursor:pointer;
    right:calc(12px + env(safe-area-inset-right, 0px));
    top:calc(10px + env(safe-area-inset-top, 0px));
    width:44px; height:44px; border-radius:50%;
    border:2px solid #ffd0e2; background:#fffffff2; color:var(--pink-deep);
    font-size:19px; line-height:1; box-shadow:0 4px 14px rgba(255,140,180,.28);
    display:flex; align-items:center; justify-content:center;
  }
  .music-btn:active{transform:scale(.94)}
  .music-btn.playing{animation:mpulse 2.4s ease-in-out infinite; background:linear-gradient(135deg,#fff0f7,#ffd7e9)}
  @keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,120,170,.5)}50%{box-shadow:0 0 0 9px rgba(255,120,170,0)}}
  .music-btn.off{opacity:.5; filter:grayscale(1)}
  /* ===== 锁屏（4 位数字密码） ===== */
  html.unlocked #lock{display:none !important}
  .lock{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(175deg,#ffe4ef 0%,#ffd3e6 55%,#ffeaf3 100%);
    padding:24px; text-align:center;
  }
  .lock.gone{opacity:0; transform:scale(1.04); pointer-events:none; transition:opacity .35s, transform .35s}
  .lock-box{width:100%; max-width:320px}
  .lock-emoji{font-size:44px; line-height:1; margin-bottom:10px; animation:lockFloat 3s ease-in-out infinite}
  @keyframes lockFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .lock-title{font-size:19px; font-weight:800; color:var(--pink-deep); letter-spacing:.5px}
  .lock-sub{font-size:13px; color:#a9829a; margin-top:6px}
  .lock-dots{display:flex; justify-content:center; gap:16px; margin:22px 0 6px}
  .lock-dots i{
    width:15px; height:15px; border-radius:50%; border:2px solid #ffb6d2; background:#fff;
    transition:transform .15s, background .15s;
  }
  .lock-dots i.on{background:linear-gradient(135deg,#ff9ec4,#ff5f9e); border-color:#ff8fb8; transform:scale(1.15)}
  .lock.shake .lock-dots{animation:lockShake .42s}
  @keyframes lockShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}55%{transform:translateX(9px)}80%{transform:translateX(-4px)}}
  .lock-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px}
  .lock-pad button{
    height:58px; border-radius:18px; border:2px solid #ffd0e2; background:#fffffff2; cursor:pointer;
    font-size:23px; font-weight:800; color:var(--pink-deep); font-family:inherit;
    box-shadow:0 4px 12px rgba(255,140,180,.16); transition:transform .1s;
  }
  .lock-pad button:active{transform:scale(.94); background:linear-gradient(135deg,#fff0f7,#ffd7e9)}
  .lock-pad button.blank{visibility:hidden}
  .lock-msg{font-size:13px; color:#d4577f; height:20px; margin-top:14px; font-weight:600}

  /* ===== 天气卡片（瑞丽 · 憨豆播报） ===== */
  .card.wx{background:linear-gradient(135deg,#eaf6ff,#fff2f9 55%,#ffeaf3);border:2px solid #cfe6fa}
  .wx-now{display:flex;align-items:center;gap:14px;padding:4px 2px 0}
  .wx-icon{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;animation:wxFloat 3.6s ease-in-out infinite}
  @keyframes wxFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .wx-icon .wx-emo{position:relative;z-index:2}
  .wx-icon .drop{position:absolute;top:0;width:2.5px;height:11px;border-radius:3px;background:linear-gradient(#bfe0f7,#5fa8de);z-index:1;animation:wxRain 1.15s linear infinite}

<iframe name="pushFrame" style="display:none" title="push"></iframe>

<script>
/* ============================================================
   江鑫颖姐姐的专属空间
   · 在一起的日子：START 为第 1 天，每天自动 +1
   · 推送：ntfy（免注册），备用 PushPlus/Server酱（?setup=1 填 token）
   ============================================================ */
const START = new Date(2026, 7, 30);        // 2026-08-30 = 第 1 天
const DAY_MS = 86400000;
const NTFY_TOPIC = 'jxy-love-2c2d8f7e9f5d';
const PUSH = { type: 'pushplus', token: '' };

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 本地存储 ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

/* ---------- 天数 ---------- */
function daysTogether(now = new Date()) {
  const a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((b - a) / DAY_MS) + 1;
}
function renderDays() {
  const now = new Date();
  $('days').textContent = daysTogether(now);
  const ms = now - START;
  $('together').textContent = '已经 ' + Math.floor(ms / DAY_MS) + ' 天 '
    + Math.floor(ms % DAY_MS / 3600000) + ' 小时 ' + Math.floor(ms % 3600000 / 60000) + ' 分 '
    + Math.floor(ms % 60000 / 1000) + ' 秒';
  document.title = '在一起第 ' + daysTogether(now) + ' 天';
}

/* ---------- 情话（第一句常驻，其余随机推送） ---------- */
const PINNED_QUOTE = 'I LOVE YOU 3000 TIME.';     // 常驻：永远显示，不参与随机
const QUOTES = [
  '姐姐我今天也很想你!',
  '真的会因为姐姐的出现而感到很幸福',
  '我远比想象中更需要你',
  '或许我的爱还不够成熟，但你很重要，也很特别，我永远喜欢你',
  'LOVE ME LONG',
  '闭上眼睛不再是黑暗，而是你'
];
let quoteIdx = Math.floor(Math.random() * QUOTES.length);
function nextQuote() {
  if (QUOTES.length < 2) { renderQuote(); return; }
  let i = quoteIdx;
  while (i === quoteIdx) i = Math.floor(Math.random() * QUOTES.length);   // 换一句不重复
  quoteIdx = i;
  renderQuote();
}
function renderQuote() {
  const q = QUOTES[quoteIdx];
  $('quote').textContent = q;
  if ($('quote2')) $('quote2').textContent = q;
  const n = new Date();
  $('quoteDate').textContent = (n.getMonth() + 1) + '月' + n.getDate() + '日';
}
$('quoteNext').addEventListener('click', nextQuote);
setInterval(nextQuote, 15 * 60 * 1000);      // 每 15 分钟自动换一句

/* ---------- 飘爱心 ---------- */
(function floaty() {
  const chars = ['💗', '🎀', '💕', '🌸'];
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = chars[i % chars.length];
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (12 + Math.random() * 12) + 'px';
    el.style.animationDuration = (11 + Math.random() * 9) + 's';
    el.style.animationDelay = (-Math.random() * 12) + 's';
    document.body.appendChild(el);
  }
})();

/* ---------- 推送 ---------- */
function getToken() {
  if (PUSH.token) return PUSH.token;
  try { return localStorage.getItem('jxy_push_token') || ''; } catch (e) { return ''; }
}
function getType() {
  const t = getToken();
  if (t.startsWith('SCT')) return 'serverchan';
  try { return localStorage.getItem('jxy_push_type') || PUSH.type; } catch (e) { return PUSH.type; }
}
async function pushToHim(title, text, prio) {
  try {
    const r = await fetch('https://ntfy.sh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topic: NTFY_TOPIC, title: title, message: text, tags: ['heart'],
        priority: prio || 3                       // 3=默认(短震) 4=高(长震+弹窗) 5=最高(最强震动)
      })
    });
    if (r.ok) return 'ntfy';
  } catch (e) { }
  const token = getToken();
  if (!token) return '';
  const type = getType();
  const form = document.createElement('form');
  form.method = 'POST'; form.target = 'pushFrame'; form.style.display = 'none';
  let action = '', fields = {};
  if (type === 'serverchan') {
    action = 'https://sctapi.ftqq.com/' + token + '.send';
    fields = { title: title, desp: text };
  } else {
    action = 'https://www.pushplus.plus/send';
    fields = { token: token, title: title, content: text.replace(/\n/g, '<br>'), template: 'html' };
  }
  form.action = action;
  Object.keys(fields).forEach((k) => {
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = fields[k];
    form.appendChild(i);
  });
  document.body.appendChild(form); form.submit();
  setTimeout(() => form.remove(), 1000);
  return 'form';
}
function stamp() {
  const n = new Date();
  return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
}

/* ---------- 底部导航 ---------- */
function showTab(name) {
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === 'view-' + name));
  document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabbar button').forEach((b) => {
  b.addEventListener('click', () => showTab(b.dataset.tab));
});
$('goPet').addEventListener('click', () => showTab('pet'));

/* ============================================================
   一次性重置：改 RESET_TAG 的值即可让所有设备下次打开时爱心归零
   也可手动强制归零：在网址后加 ?reset=1
   ============================================================ */
const RESET_TAG = 'hearts-0-2026-09-27';
const FORCE_RESET = new URLSearchParams(location.search).get('reset') === '1';
if (FORCE_RESET || LS.get('jxy_reset_tag', '') !== RESET_TAG) {
  const _d = new Date();
  const _today = _d.getFullYear() + '-' + pad(_d.getMonth() + 1) + '-' + pad(_d.getDate());
  LS.set('jxy_hearts', 0);
  LS.set('jxy_heart_day', { d: _today, used: 0 });
  LS.set('jxy_reset_tag', RESET_TAG);
  if (FORCE_RESET) {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { }
  }
}

/* ============================================================
   爱心（每天最多 2 颗，所有来源共用这个额度）
   ============================================================ */

function heartUsedToday() {
  const t = todayStr();
  const st = LS.get('jxy_heart_day', { d: t, used: 0 });
  return st.d === t ? Math.min(st.used, HEART_CAP) : 0;
}
function renderHeartBudget() {
  const used = heartUsedToday();
  const txt = '今日 ' + used + '/' + HEART_CAP;
  ['heartBudgetHome', 'heartBudgetPet'].forEach((id) => { if ($(id)) $(id).textContent = txt; });

function addHearts(n, why) {
  const t = todayStr();
  let st = LS.get('jxy_heart_day', { d: t, used: 0 });
  if (st.d !== t) st = { d: t, used: 0 };
  const give = Math.max(0, Math.min(n, HEART_CAP - st.used));
  if (give > 0) {
    st.used += give;
    LS.set('jxy_heart_day', st);
    setHearts(hearts + give);
    petFx('💗', 3);
    petSay('+' + give + ' 💗' + (why ? '（' + why + '）' : ''));
    beep(880, 0.1);
  } else {
    petSay('今天的爱心已经拿满啦，明天再赚～');
  }
  renderHeartBudget();
  return give;
}

};
let moodPick = 0;

function moodData() { return LS.get('jxy_mood', {}); }
function moodSave(obj) { LS.set('jxy_mood', obj); }
function moodKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function moodDateLabel(key, isToday) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dt.getDay()];
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(y, m - 1, d).setHours(0, 0, 0, 0)) / 86400000);
  const pre = days === 0 ? '今天 · ' : days === 1 ? '昨天 · ' : days === 2 ? '前天 · ' : '';
  return pre + (m) + '月' + d + '日 ' + wk;
}

function renderMood() {
  const data = moodData();
  const todayKey = moodKey(new Date());
  const today = data[todayKey];
  if (!moodPick && today) moodPick = today.lv;                 // 恢复今天已选的心情
  document.querySelectorAll('#moods button').forEach((b) => {
    b.classList.toggle('on', +b.dataset.lv === moodPick);
  });
  if (today && $('moodText').value === '') $('moodText').value = today.text || '';
  $('moodDate').textContent = moodDateLabel(todayKey, true);
  $('moodTip').textContent = today
    ? '今天记过啦（' + MOODS[today.lv].e + ' ' + MOODS[today.lv].n + '），想改就再点「记下来」～'
    : '';

  // 最近 7 天（今天在最左边）
  let strip = '';
  const start = new Date(); start.setHours(0, 0, 0, 0);
  for (let i = 0; i < 7; i++) {
    const dt = new Date(start.getTime() - i * 86400000);
    const k = moodKey(dt);
    const rec = data[k];
    const m = rec ? MOODS[rec.lv] : null;
    strip += '<div class="mood-day' + (i === 0 ? ' today' : '') + '">'
      + '<div class="d">' + (i === 0 ? '今天' : (dt.getMonth() + 1) + '/' + dt.getDate()) + '</div>'
      + '<span class="e' + (m ? '' : ' empty') + '">' + (m ? m.e : '·') + '</span>'
      + '<div class="b"><i style="width:' + (m ? '100' : '0') + '%;background:' + (m ? m.c : 'transparent') + '"></i></div>'
      + '</div>';
  }
  $('moodStrip').innerHTML = strip;

  // 统计（本月）
  const now = new Date();
  const mPrefix = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  let good = 0, bad = 0, all = 0;
  Object.keys(data).forEach((k) => {
    if (k.indexOf(mPrefix) === 0) { all++; if (data[k].lv >= 4) good++; if (data[k].lv <= 2) bad++; }
  });
  $('moodStat').textContent = all ? '本月 ' + all + ' 天 · 开心 ' + good + ' 天' + (bad ? ' · 难过 ' + bad + ' 天' : '') : '还没有记录～';

  // 日记列表
  const keys = Object.keys(data).sort().reverse();
  $('moodCount').textContent = keys.length ? keys.length + ' 天' : '';
  const box = $('moodList');
  if (!keys.length) { box.innerHTML = '<div class="muted">还没有记过咧姐姐~ 今天记第一条吧 ♡</div>'; return; }
  box.innerHTML = keys.slice(0, 30).map((k) => {
    const rec = data[k], m = MOODS[rec.lv] || MOODS[3];
    return '<div class="item">'
      + '<div class="h"><span class="t">' + m.e + ' ' + m.n + '</span>'
      + '<span class="time">' + moodDateLabel(k, k === todayKey) + '</span></div>'
      + (rec.text ? '<div class="b"></div>' : '<div class="muted" style="margin:0">（这天没写什么）</div>')
      + '</div>';
  }).join('');
  // 文本要单独塞，避免 HTML 注入
  box.querySelectorAll('.item').forEach((el, i) => {
    const rec = data[keys[i]];
    if (rec && rec.text && el.querySelector('.b')) el.querySelector('.b').textContent = rec.text;
  });
  renderCal();                                   // 月历跟着一起刷新
}

  let html = '', good = 0, bad = 0, cnt = 0;
  for (let i = 0; i < lead; i++) html += '<div class="cal-day blank"></div>';
  for (let d = 1; d <= days; d++) {
    const key = y + '-' + pad(m + 1) + '-' + pad(d);

    if (rec) { cnt++; if (rec.lv >= 4) good++; if (rec.lv <= 2) bad++; }

      + (key === calSelKey ? ' sel' : '') + '" data-k="' + key + '">'
      + '<span class="n">' + d + '</span>'
      + '<span class="e">' + (rec ? (MOODS[rec.lv] || MOODS[3]).e : '') + '</span></div>';

    ? '记录 ' + cnt + ' 天 · 开心 ' + good + ' 天' + (bad ? ' · 难过 ' + bad + ' 天' : '')

   ============================================================ */
let petActTimer = null, lastTouch = Date.now(), sleeping = false, AC = null;

function beep(freq, dur) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur || 0.12));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.12));
  } catch (e) { }
}

/* 一次性动作：hop 跳 / squash 挤一下 / chew 咀嚼 / squat 蹲下拉屎 / shake 抖 / relieved 放松 */
function petAct(name, dur) {
  const el = $('petAct');
  el.className = 'pet-act';
  void el.offsetWidth;
  if (name) el.classList.add('act-' + name);
  clearTimeout(petActTimer);
  petActTimer = setTimeout(() => { el.className = 'pet-act'; }, dur || 720);
}

/* 特效：在宠物区冒 emoji */
function petFx(chars, n, opt) {
  const box = $('fx');
  const area = $('petArea').getBoundingClientRect();
  const list = Array.isArray(chars) ? chars : [chars];
  for (let i = 0; i < (n || 1); i++) {
    const el = document.createElement('i');
    el.textContent = list[i % list.length];
    const x = area.width / 2 + (Math.random() * 90 - 45);
    const y = area.height * (opt && opt.fromPet ? 0.72 : 0.5) + (Math.random() * 20 - 10);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (16 + Math.random() * 12) + 'px';
    if (opt && opt.arc) {
      el.style.transition = 'transform 1.1s cubic-bezier(.2,.7,.4,1), opacity 1.1s ease';
      box.appendChild(el);
      requestAnimationFrame(() => {
        el.style.transform = 'translate(' + (opt.arc[0]) + 'px,' + (opt.arc[1]) + 'px) rotate(' + (Math.random() * 220 - 110) + 'deg)';
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 1200);
    } else {
      box.appendChild(el);
      el.classList.add('pop');
      setTimeout(() => el.remove(), 1000);
    }
  }
}

  });

}

/* 随时间衰减：饱食度每 20 分钟 -1；每 25 分钟拉一坨（最多 6 坨） */
function tickPet() {
  const now = Date.now();
  const mins = (now - pet.tHunger) / 60000;
  if (mins >= 1) {
    const dec = Math.floor(mins / 20);
    if (dec > 0) { pet.hunger = clamp(pet.hunger - dec, 0, 100); pet.tHunger = now; }
  }
  const pmins = (now - pet.tPoop) / 60000;
  if (pmins >= 25) {
    const add = Math.min(Math.floor(pmins / 25), 6 - pet.poop);
    if (add > 0) {
      pet.poop = clamp(pet.poop + add, 0, 6);
      pet.tPoop = now;
      if (!document.hidden) petPoopNow();       // 蹲下 → 掉一坨 → 放松
    }
  }
  // 饿久了心情下降
  if (pet.hunger < 20) pet.happy = clamp(pet.happy - 0.5, 0, 100);

const PASSCODE = '1110';

function pressKey(k) {
  if (!k) return;
  if (k === 'del') { pin = pin.slice(0, -1); paintPin(); return; }
  if (pin.length >= 4 || pin === PASSCODE) return;
  pin += k;
  paintPin();
  if (pin.length === 4) {
    if (pin === PASSCODE) { $('lockMsg').textContent = '欢迎回来，姐姐 ♡'; unlockSite(); }
    else { lockFail(); }
  }
}

});

  0: ['☀️', '大晴天'], 1: ['🌤️', '太阳露脸'], 2: ['⛅', '云在飘'], 3: ['☁️', '阴阴的'],

  56: ['🌧️', '冻毛毛雨'], 57: ['🌧️', '冻雨'], 61: ['🌧️', '下小雨'], 63: ['🌧️', '下中雨'], 65: ['🌧️', '下大雨'],

};
const wxInfo = (c) => WX_CODES[c] || ['🌤️', '还不错'];
const wxFresh = (c) => c && c.t && (Date.now() - c.t < 30 * 60 * 1000);   // 缓存 30 分钟

/* 天气码 → 动画类型 */
function wxKind(c) {
  if (c >= 95) return 'storm';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if (c === 45 || c === 48) return 'fog';
  if (c <= 1) return 'sun';
  return 'cloud';
}

/* 会动的天气图标：下雨就落雨点、出太阳就发光晕、起雾就飘雾带 */
function setWxIcon(emo, code) {
  const el = $('wxIcon');
  const kind = wxKind(code);
  let inner = '<span class="wx-emo">' + emo + '</span>';
  if (kind === 'rain' || kind === 'storm') {
    for (let i = 0; i < 5; i++) {
      inner += '<i class="drop" style="left:' + (14 + i * 17) + '%;animation-delay:' + (i * 0.19).toFixed(2) + 's"></i>';
    }
    if (kind === 'storm') inner += '<i class="flash"></i>';
  } else if (kind === 'snow') {
    for (let i = 0; i < 5; i++) {
      inner += '<i class="flake" style="left:' + (14 + i * 17) + '%;animation-delay:' + (i * 0.32).toFixed(2) + 's"></i>';
    }
  } else if (kind === 'sun') {
    inner += '<i class="sun"></i>';
  } else if (kind === 'fog') {
    for (let i = 0; i < 3; i++) {
      inner += '<i class="fog" style="top:' + (24 + i * 18) + '%;animation-delay:' + (i * 0.6).toFixed(2) + 's"></i>';
    }
  } else {
    inner += '<i class="cloud"></i>';
  }
  el.innerHTML = inner;
}

/* 把小时数变成可爱说法：13 → 下午 1 点 */
const WX_TIME_CUTE = (h) => {
  if (h === 0) return '半夜 12 点';
  if (h < 6) return '凌晨 ' + h + ' 点';
  if (h < 9) return '早上 ' + h + ' 点';
  if (h < 12) return '上午 ' + h + ' 点';
  if (h === 12) return '中午 12 点';
  if (h < 18) return '下午 ' + (h - 12) + ' 点';
  if (h < 20) return '傍晚 ' + (h - 12) + ' 点';
  return '晚上 ' + (h - 12) + ' 点';
};

/* 逐小时：一条可横滑的小时条 + “几点可能下雨”的可爱提示 */
function renderHourly(dayIdx) {
  const H = wxData && wxData.hourly;
  if (!H) { $('wxHourly').innerHTML = '<div class="wx-hsum">每小时的数据还在路上…</div>'; return; }
  const date = wxData.daily.time[dayIdx];
  const idx = [];
  for (let i = 0; i < H.time.length; i++) {
    if (H.time[i].slice(0, 10) === date) {
      const hh = parseInt(H.time[i].slice(11, 13), 10);
      if (hh >= 6 && hh <= 23) idx.push(i);
    }
  }
  let firstRain = -1, maxP = 0;
  idx.forEach((i) => {
    const p = H.precipitation_probability[i] || 0;
    if (p > maxP) maxP = p;
    if (firstRain < 0 && p >= 50) firstRain = parseInt(H.time[i].slice(11, 13), 10);
  });
  const sum = firstRain >= 0
    ? '☔ ' + WX_TIME_CUTE(firstRain) + '前后可能下雨，记得带伞'
    : (maxP >= 30 ? '🌦️ 可能有小雨，出门带把伞更稳妥' : '☀️ 一整天天气都不错');
  let html = '<div class="wx-hsum">' + sum + '</div><div class="wx-hrow">';
  idx.forEach((i) => {
    const p = H.precipitation_probability[i] || 0;
    const [e] = wxInfo(H.weather_code[i]);
    html += '<div class="wx-h' + (p >= 50 ? ' wet' : '') + '">'
      + '<div class="t">' + H.time[i].slice(11, 13) + '时</div>'
      + '<div class="e">' + e + '</div>'
      + '<div class="c">' + Math.round(H.temperature_2m[i]) + '°</div>'
      + '<div class="bar"><i style="height:' + Math.max(2, Math.round(p * 0.26)) + 'px"></i></div>'
      + '<div class="p">' + (p >= 10 ? p + '%' : '') + '</div></div>';
  });
  html += '</div>';
  $('wxHourly').innerHTML = html;
}

/* 天气提示：正常说法，不堆叠词、不说教 */
function wxCute(n, day) {
  const t = n.temp, c = n.code, rain = day.rain, uv = day.uv, hum = n.hum, wind = n.wind;
  const out = [];
  if (c >= 95) out.push('有雷阵雨，尽量先别出门');
  else if (rain >= 70) out.push('会下雨，记得带伞☔');
  else if (rain >= 40) out.push('可能会下雨，带把伞放包里');
  else if (c === 0) out.push('天气晴朗');
  else if (c <= 2) out.push('多云，天气不错');
  else if (c === 3) out.push('阴天，比较凉快');
  else if (c >= 45 && c <= 48) out.push('有雾，出门注意看路');
  if (t >= 32) out.push('很热，穿短袖合适');
  else if (t >= 28) out.push('比较暖和，穿薄一点就行');
  else if (t >= 24) out.push('温度刚好，正常穿就行');
  else if (t >= 20) out.push('有点凉，建议加件外套');
  else if (t >= 15) out.push('比较凉，穿厚一点');
  else out.push('很冷，穿暖和点再出门');
  if (uv >= 7) out.push('紫外线偏强，注意防晒');
  if (hum >= 90) out.push('湿度很高，记得多喝水');
  if (wind >= 20) out.push('风比较大，出门注意');
  return out.slice(0, 3).join('，') + '。';
}

function wxWeekName(i, dateStr) {
  if (i === 0) return '今天';
  if (i === 1) return '明天';
  const d = new Date(dateStr + 'T00:00:00');
  return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
}

    const t = Math.round(cur.temperature_2m), feels = Math.round(cur.apparent_temperature);
    const hum = Math.round(cur.relative_humidity_2m), wind = cur.wind_speed_10m;
    $('wxTemp').innerHTML = t + '<i>°</i>';
    $('wxMeta').textContent = '体感 ' + feels + '° · 湿度 ' + hum + '% · 风 ' + Math.round(wind) + 'km/h'
      + (rain !== null ? ' · 降雨 ' + rain + '%' : '');
    $('wxSay').textContent = wxCute({ temp: t, code: code, hum: hum, wind: wind, feels: feels }, { rain: rain, uv: uv });
  } else {
    $('wxTemp').innerHTML = tmax + '<i>°</i>';
    $('wxMeta').textContent = '最高 ' + tmax + '° / 最低 ' + tmin + '°'
      + (rain !== null ? ' · 降雨 ' + rain + '%' : '')
      + ' · 紫外线 ' + Math.round(uv)
      + (D.sunrise && D.sunrise[wxSel] ? ' · 日出 ' + hhmm(D.sunrise[wxSel]) + ' 日落 ' + hhmm(D.sunset[wxSel]) : '');
    $('wxSay').textContent = wxCute({ temp: tmax, code: code, hum: -1, wind: -1 }, { rain: rain, uv: uv });
  }
  const now = new Date();
  $('wxDate').textContent = wxSel === 0
    ? (now.getMonth() + 1) + '月' + now.getDate() + '日'
    : D.time[wxSel].slice(5).replace('-', ' 月 ') + ' 日';

  let html = '';
  for (let i = 0; i < D.time.length; i++) {
    const e = wxInfo(D.weather_code[i])[0];
    html += '<div class="wx-day' + (i === 0 ? ' today' : '') + (i === wxSel ? ' sel' : '') + '" data-i="' + i + '">'
      + '<div class="d">' + wxWeekName(i, D.time[i]) + '</div>'
      + '<div class="e">' + e + '</div>'
      + '<div class="t">' + Math.round(D.temperature_2m_max[i]) + '° / '
      + Math.round(D.temperature_2m_min[i]) + '°</div></div>';
  }
  $('wxWeek').innerHTML = html;
  $('wxHourly').style.display = 'none';                  // 换天先收起逐小时
  $('wxHint').textContent = '戳小格子看别的天，再戳一下看每小时的天气～';
  $('wxCard').classList.remove('wx-busy');
}

/* 点某一天 → 看那天的详情；再点同一天 → 展开/收起逐小时；点卡片其他地方 → 刷新天气 */
$('wxWeek').addEventListener('click', (e) => {
  const el = e.target.closest('.wx-day');
  if (!el || !wxData) return;
  e.stopPropagation();
  const i = parseInt(el.dataset.i, 10);
  const box = $('wxHourly');
  if (i === wxSel && box.innerHTML) {                    // 再戳一下 → 展开/收起
    const open = box.style.display !== 'none';
    box.style.display = open ? 'none' : 'block';
    $('wxHint').textContent = open ? '再戳一下看每小时的天气～' : '再戳一下收起来';
    try { beep(open ? 520 : 760, 0.06); } catch (err) { }
    return;
  }
  renderWx(wxData, i);
  renderHourly(i);
  $('wxHint').textContent = '再戳一下这个格子，看每小时的天气～';
  try { beep(660, 0.06); } catch (err) { }
});

async function loadWx(force) {
  const cached = LS.get(WX_CACHE_KEY, null);
  if (!force && cached && wxFresh(cached)) { renderWx(cached.data); return; }
  if (cached && cached.data) renderWx(cached.data);        // 先用旧数据顶上，不空白
  $('wxCard').classList.add('wx-busy');
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 8000);        // 8 秒拿不到就放弃，不让卡片一直转圈
  try {
    const r = await fetch(WX_URL, { signal: ac.signal, cache: 'no-store' });
    const j = await r.json();
    LS.set(WX_CACHE_KEY, { t: Date.now(), data: j });
    renderWx(j);
  } catch (e) {
    if (!cached || !cached.data) {
      $('wxIcon').innerHTML = '<span class="wx-emo">🫧</span>';
      $('wxDesc').textContent = '天气小精灵跑丢了';
      $('wxMeta').textContent = '';
      $('wxSay').textContent = '等一会儿再戳我一下，我再问问它～';
      $('wxHint').textContent = '';
    }
    $('wxCard').classList.remove('wx-busy');
  } finally {
    clearTimeout(timer);
  }
}
$('wxCard').addEventListener('click', () => loadWx(true));   // 点一下重新问天气

/* ============================================================
   背景音乐（浏览器规定必须由用户点一下才能出声）
   ============================================================ */
const bgm = $('bgm'), musicBtn = $('musicBtn');
/* 音源：CDN 优先（对国内网络快 5 倍以上），拿不到就自动切回仓库里的文件 */
const BGM_SOURCES = [
  'https://cdn.jsdelivr.net/gh/zhujingche/love@7270dc5826381d253939933f122cb882aa80bedc/bgm.mp3',
  'bgm.mp3',
  'bgm.wav'
];
let bgmSrcIdx = 0, bgmWanted = LS.get('jxy_bgm', 'on') === 'on', bgmStarted = false;
let bgmGotData = false;                      // CDN 只要开始下载就不要换源（否则会切到更慢的源）
bgm.src = BGM_SOURCES[0];

function nextBgmSource() {
  if (bgmSrcIdx >= BGM_SOURCES.length - 1) return false;
  bgmSrcIdx++;
  const wasPlaying = !bgm.paused;
  bgmGotData = false;
  bgm.src = BGM_SOURCES[bgmSrcIdx];
  bgm.load();
  if (wasPlaying && bgmWanted) { bgmStarted = false; startBgm(); }
  return true;
}
bgm.addEventListener('progress', () => { bgmGotData = true; });
bgm.addEventListener('loadedmetadata', () => { bgmGotData = true; });
/* 只有「完全没有数据」持续约 21 秒才换下一个源 */
setInterval(() => {
  if (!bgmStarted && bgmWanted && !bgmGotData && !(bgm.duration > 0)) {
    if (bgm._slowTicks === undefined) bgm._slowTicks = 0;
    if (++bgm._slowTicks >= 6) { bgm._slowTicks = 0; nextBgmSource(); }
  }
}, 3500);
bgm.addEventListener('error', () => { nextBgmSource(); });

function paintMusic() {
  const playing = !bgm.paused;                 // 只要没暂停就算在播
  musicBtn.textContent = playing ? '🎵' : '🔇';
  musicBtn.classList.toggle('playing', playing);
  musicBtn.classList.toggle('off', !bgmWanted && !playing);
}
function fadeIn() {
  let v = 0;
  bgm.volume = 0;
  clearInterval(bgm._fade);
  bgm._fade = setInterval(() => {
    v = Math.min(0.45, v + 0.03);
    bgm.volume = v;
    if (v >= 0.45) clearInterval(bgm._fade);
  }, 60);
}
function startBgm() {
  if (!bgmWanted || bgmStarted) return;
  const p = bgm.play();
  if (p && p.then) {
    p.then(() => { bgmStarted = true; fadeIn(); paintMusic(); })
      .catch(() => {
        if (bgm.networkState === 3 || bgm.error) { musicBtn.style.display = 'none'; }  // 没有音频文件
        paintMusic();
      });
  }
}
musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (bgm.paused) {                     // 点一下 → 播放
    bgmWanted = true;
    LS.set('jxy_bgm', 'on');
    bgmStarted = false;
    startBgm();
  } else {                              // 再点一下 → 暂停
    bgmWanted = false;
    LS.set('jxy_bgm', 'off');
    bgm.pause();
    bgmStarted = false;
  }
  paintMusic();
  beep(bgmWanted ? 660 : 440, 0.08);
});
bgm.addEventListener('play', paintMusic);
bgm.addEventListener('playing', paintMusic);
bgm.addEventListener('pause', paintMusic);
/* 双保险：即使浏览器没有遵守 loop，播完也立刻从头再来 */
bgm.addEventListener('ended', () => {
  if (!bgmWanted) return;
  try { bgm.currentTime = 0; } catch (e) { }
  bgm.play().catch(() => { });
});
/* 播到一半被系统暂停（切后台/锁屏）时，回到前台继续 */
bgm.addEventListener('stalled', () => { if (bgmWanted) setTimeout(() => startBgm(), 1200); });
/* 首次任意点击/触摸 → 尝试播放；未成功则下次点击再试 */
window.addEventListener('pointerdown', () => startBgm(), { passive: true });
window.addEventListener('touchstart', () => startBgm(), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && bgmWanted) startBgm(); });
paintMusic();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* 天气：放在脚本最末尾调用，确保 WX_URL 等常量都已初始化（避免 TDZ 报错） */
loadWx();
</script>
