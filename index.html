<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec4">
<meta name="robots" content="noindex, nofollow">
<title>江鑫颖姐姐的专属空间</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="专属空间">
<style>
  :root{
    --pink:#ff8fb8; --pink-deep:#ff5f9e; --pink-soft:#ffe6f0;
    --ink:#5a3a47; --ink-soft:#8b6b78; --card:#fffffff0; --line:#ffd7e6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(175deg,#ffeaf3 0%,#ffe1ee 45%,#fff1f7 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding:12px 12px calc(86px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .floaty{position:fixed;top:-40px;font-size:18px;opacity:.6;pointer-events:none;animation:fall linear infinite;z-index:0}
  @keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:.75}100%{transform:translateY(115vh) rotate(320deg);opacity:0}}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto}

  /* ===== 顶部标题 ===== */
  .top-title{
    text-align:center; margin:4px 0 10px;
    font-size:18px; font-weight:800; color:var(--pink-deep);
    letter-spacing:1px; text-shadow:0 2px 0 #fff;
  }
  .top-title small{display:block;font-size:11.5px;font-weight:600;color:#c58fa6;letter-spacing:0;margin-top:3px}

  /* ===== 天数 ===== */
  .days-badge{
    text-align:center; background:linear-gradient(135deg,#ff9ec4,#ff6aa6); color:#fff;
    border-radius:24px; padding:14px 16px 16px; margin-bottom:12px;
    box-shadow:0 10px 24px rgba(255,110,165,.34), inset 0 -3px 0 rgba(255,255,255,.32);
    position:relative; overflow:hidden;
  }
  .days-badge::after{content:"";position:absolute;top:-60%;left:-30%;width:80%;height:200%;
    background:linear-gradient(90deg,#ffffff00,#ffffff55,#ffffff00);transform:rotate(18deg);animation:shine 4.5s ease-in-out infinite}
  @keyframes shine{0%,60%{left:-40%}100%{left:120%}}
  .days-line{font-size:14px;opacity:.95}
  .days-num{font-size:52px;line-height:1.05;font-weight:800;text-shadow:0 4px 0 rgba(190,60,110,.3);display:inline-block}
  .days-unit{font-size:18px;font-weight:700;margin-left:4px}
  .days-sub{font-size:12px;opacity:.92;margin-top:4px}

  /* ===== 卡片 ===== */
  .card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 6px 16px rgba(255,140,180,.15);margin-bottom:12px}
  .card .k{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .quote{font-size:15px;font-weight:600;line-height:1.8}
  /* 常驻情话卡片 */
  .card.pinned{background:linear-gradient(135deg,#fff3f9,#ffe4f0);border:2px solid #ffd0e2}
  .pinned-text{
    font-size:20px; font-weight:800; color:var(--pink-deep); text-align:center;
    letter-spacing:.5px; line-height:1.7; padding:6px 0 2px;
    text-shadow:0 1px 0 #fff;
  }
  .row{display:flex;gap:10px;align-items:center}
  .row .col{flex:1; min-width:0}
  .btn{min-width:0}

  /* ===== 爱心/按钮 ===== */
  .hearts{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#e8437a}
  .btn{
    border:none;cursor:pointer;color:#fff;font-weight:800;font-size:14.5px;
    background:linear-gradient(135deg,#ff9ec4,#ff5f9e);border-radius:16px;padding:12px 10px;
    box-shadow:0 8px 18px rgba(255,95,158,.3);transition:transform .12s;width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:2px solid var(--line);box-shadow:none}
  .btn.small{font-size:13px;padding:10px 6px;border-radius:13px}
  .btn:disabled{opacity:.55}

  /* ===== 输入 ===== */
  textarea,input[type=text]{
    width:100%;border:1px solid var(--line);background:#fffafd;border-radius:14px;
    padding:11px 12px;font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);outline:none;resize:vertical;
  }
  textarea::placeholder,input::placeholder{color:#cfa9ba}
  label.lb{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 5px;font-weight:600}

  /* ===== 消气：程度 ===== */
  .levels{display:flex;gap:8px}
  .levels button{
    flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;
    font-size:12.5px;color:var(--ink-soft);font-weight:700;cursor:pointer;line-height:1.5;
  }
  .levels button .e{display:block;font-size:20px;margin-bottom:2px}
  .levels button.on{background:#fff0f6;border-color:var(--pink);color:var(--pink-deep);transform:translateY(-1px)}

  /* ===== 列表项 ===== */
  .item{background:#fffdfe;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .item .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .item .t{font-weight:700;font-size:14px}
  .item .time{font-size:11.5px;color:#c58fa6;white-space:nowrap}
  .item .b{font-size:14px;white-space:pre-wrap;line-height:1.75;color:#6b4a58}
  .item .need{font-size:13px;color:#a2607f;background:#fff3f8;border-radius:10px;padding:7px 10px;margin-top:7px;line-height:1.7}
  .muted{font-size:12.5px;color:#bb92a4;text-align:center;padding:16px 6px;line-height:1.9}

  /* ===== 桌宠 ===== */
  .pet-area{
    position:relative;height:342px;border-radius:20px;overflow:hidden;margin-bottom:12px;
    background:linear-gradient(180deg,#fff6fb 0%,#ffe9f3 70%,#ffe0ee 100%);
    border:2px solid var(--line);
  }
  .pet-area .floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,#ffe0ee,#ffd0e4);z-index:1}
  .pet-wrap{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:212px;height:226px;z-index:2}
  /* 两层包裹：petAnim 负责待机呼吸/左右轻摆，petAct 负责点击、吃东西、拉屎等一次性动作 */
  .pet-anim,.pet-act{position:relative;width:100%;height:100%;transform-origin:50% 92%}
  .pet-anim{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{transform:scale(1,1) translateY(0)}
    50%{transform:scale(1.018,1.035) translateY(-2px)}
  }
  .pet-act.act-hop{animation:actHop .62s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes actHop{
    0%{transform:translateY(0) scale(1,1)}
    22%{transform:translateY(2px) scale(1.06,.9)}
    55%{transform:translateY(-20px) scale(.97,1.05)}
    78%{transform:translateY(3px) scale(1.05,.93)}
    100%{transform:translateY(0) scale(1,1)}
  }
  .pet-act.act-squash{animation:actSquash .5s ease both}
  @keyframes actSquash{
    0%{transform:scale(1,1)}
    30%{transform:scale(1.12,.86) translateY(4px)}
    62%{transform:scale(.95,1.07) translateY(-4px)}
    100%{transform:scale(1,1)}
  }
  .pet-act.act-chew{animation:actChew .62s ease-in-out both}
  @keyframes actChew{
    0%,100%{transform:scale(1,1)}
    20%,60%{transform:scale(1.07,.93) translateY(2px)}
    40%,80%{transform:scale(.97,1.04) translateY(-2px)}
  }
  .pet-act.act-squat{animation:actSquat 1.15s ease both}
  @keyframes actSquat{
    0%{transform:scale(1,1) translateY(0)}
    18%,72%{transform:scale(1.1,.86) translateY(8px)}
    100%{transform:scale(1,1) translateY(0)}
  }
  .pet-act.act-shake{animation:actShake .42s ease both}
  @keyframes actShake{
    0%,100%{transform:rotate(0)}
    25%{transform:rotate(-3.2deg)}
    60%{transform:rotate(3.2deg)}
  }
  .pet-act.act-relieved{animation:actRelieved .8s ease both}
  @keyframes actRelieved{
    0%{transform:scale(1,.9) translateY(6px)}
    45%{transform:scale(.97,1.06) translateY(-10px)}
    100%{transform:scale(1,1) translateY(0)}
  }
  .pet-anim.sleeping{animation:breathe 5.4s ease-in-out infinite;filter:saturate(.92)}
  /* 眨眼：两块肤色椭圆盖在眼睛上，定时闪一下 */
  .eyelid{
    position:absolute;background:#f9f4d6;border-radius:50%;opacity:0;
    transform:scaleY(0);transform-origin:50% 0;
    animation:blink 5.6s infinite;
  }
  #eyeL{left:31%;top:43.5%;width:11%;height:9.5%;animation-delay:.2s}
  #eyeR{left:58.8%;top:43.7%;width:11.7%;height:10%;animation-delay:.2s}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(0);opacity:0}
    94%{transform:scaleY(1);opacity:1}
    96%{transform:scaleY(1);opacity:1}
    98%{transform:scaleY(0);opacity:0}
  }
  /* 特效层（爱心、胡萝卜、便便、星星） */
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .fx i{position:absolute;font-style:normal;font-size:20px;transition:transform 1s ease-out,opacity 1s ease-out}
  .fx i.pop{animation:fxPop .9s ease both}
  @keyframes fxPop{0%{transform:translateY(0) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-46px) scale(1.15);opacity:0}}
  .pet-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(200,120,160,.25))}
  /* 换装图层(emoji 浮层)：位置按兔子身体比例调过 */
  .lay{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;line-height:1}
  .lay.hat{top:52px;font-size:34px}
  .lay.glasses{top:96px;font-size:30px}
  .lay.clothes{top:148px;font-size:46px}
  .lay.deco{top:128px;font-size:30px;left:auto;right:0;transform:none}
  #petSvg{width:100%;height:100%}
  #petSvg svg,#petSvg img{width:100%;height:100%;display:block;object-fit:contain}
  .poops{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:10px;font-size:24px;z-index:3}
  .poop{animation:pop .4s ease both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .bubble{
    position:absolute;left:50%;transform:translateX(-50%);top:8px;max-width:88%;z-index:6;
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;
    font-size:13px;line-height:1.6;box-shadow:0 4px 12px rgba(255,140,180,.2);
  }
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--line)}
  @keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .bars{display:flex;gap:10px;margin-bottom:10px}
  .bar-box{flex:1;background:#fff;border-radius:14px;padding:9px 11px;border:1px solid var(--line)}
  .bar-box .n{font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:5px}
  .bar-bg{height:8px;background:#ffe6f0;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb3d1,#ff5f9e);transition:width .3s}
  .bar-fill.green{background:linear-gradient(90deg,#a8e6a3,#4cc76a)}

  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .shop-item{
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;
  }
  .shop-item.owned{border-color:#b8e6c2;background:#f4fff7}
  .shop-item.on{border-color:var(--pink);background:#fff0f6;box-shadow:0 4px 12px rgba(255,120,170,.25)}
  .shop-item .e{font-size:26px}
  .shop-item .nm{font-size:11.5px;margin-top:3px;color:var(--ink)}
  .shop-item .pr{font-size:11px;color:#e8437a;font-weight:700;margin-top:2px}
  .shop-item.owned .pr{color:#4cc76a}

  /* ===== 游戏弹窗 ===== */
  .modal{position:fixed;inset:0;background:rgba(90,58,71,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.on{display:flex}
  .modal-card{background:#fff;border-radius:20px;padding:18px;max-width:360px;width:100%;text-align:center}
  .modal-card h3{margin:0 0 6px;font-size:17px}
  .modal-card p{margin:0 0 12px;font-size:13px;color:var(--ink-soft);line-height:1.7}
  .rps{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
  .rps button{font-size:30px;background:#fff5fa;border:2px solid var(--line);border-radius:16px;padding:8px 12px;cursor:pointer}
  .rps button:active{transform:scale(.95)}
  .game-res{font-size:15px;font-weight:700;min-height:24px;margin:10px 0 4px;color:var(--pink-deep)}

  /* ===== 底部导航 ===== */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;background:#fffffff5;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .tabbar button{
    flex:1;border:none;background:none;cursor:pointer;padding:6px 2px;border-radius:14px;
    font-family:inherit;color:#b58ba0;font-size:11px;font-weight:700;line-height:1.35;
  }
  .tabbar button .e{display:block;font-size:21px;margin-bottom:1px;filter:grayscale(.35);opacity:.75}
  .tabbar button.on{color:var(--pink-deep);background:#fff0f6}
  .tabbar button.on .e{filter:none;opacity:1;transform:scale(1.06)}
  .view{display:none}
  .view.on{display:block}

  /* ===== 背景音乐按钮 ===== */
  .music-btn{
    position:fixed; z-index:45; cursor:pointer;
    right:calc(12px + env(safe-area-inset-right, 0px));
    top:calc(10px + env(safe-area-inset-top, 0px));
    width:44px; height:44px; border-radius:50%;
    border:2px solid #ffd0e2; background:#fffffff2; color:var(--pink-deep);
    font-size:19px; line-height:1; box-shadow:0 4px 14px rgba(255,140,180,.28);
    display:flex; align-items:center; justify-content:center;
  }
  .music-btn:active{transform:scale(.94)}
  .music-btn.playing{animation:mpulse 2.4s ease-in-out infinite; background:linear-gradient(135deg,#fff0f7,#ffd7e9)}
  @keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,120,170,.5)}50%{box-shadow:0 0 0 9px rgba(255,120,170,0)}}
  .music-btn.off{opacity:.5; filter:grayscale(1)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= 首页 ================= -->
  <section class="view on" id="view-home">
    <div class="top-title">江鑫颖姐姐的专属空间</div>

    <div class="days-badge">
      <div class="days-line">在一起第</div>
      <div><span class="days-num" id="days">—</span><span class="days-unit">天</span></div>
      <div class="days-sub" id="together">—</div>
    </div>

    <div class="card">
      <div class="k"><span>今天想对你说</span><span id="quoteDate"></span></div>
      <div class="quote" id="quote">—</div>
      <div style="margin-top:10px"><button class="btn ghost small" id="quoteNext">换一句</button></div>
    </div>

    <div class="card">
      <div class="k"><span>我的爱心</span><span><span class="hearts">💗 <span id="heartsHome">0</span></span> <span id="heartBudgetHome" style="font-size:11.5px;color:#bb92a4"></span></span></div>
      <button class="btn" id="checkinBtn">每日签到</button>
      <div id="checkinTip" style="font-size:12px;color:#bb92a4;text-align:center;margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="k"><span>憨豆今天的状态</span><span id="petMood">—</span></div>
      <div class="row">
        <div class="col" style="font-size:13.5px;line-height:1.8" id="petBrief">—</div>
      </div>
      <div style="margin-top:10px"><button class="btn ghost small" id="goPet">去看看憨豆</button></div>
    </div>
  </section>

  <!-- ================= 情话 ================= -->
  <section class="view" id="view-love">
    <div class="top-title">情话</div>

    <!-- 常驻情话（永远显示，不参与随机） -->
    <div class="card pinned">
      <div class="k"><span>一直想对你说</span><span class="hearts">💗</span></div>
      <div class="pinned-text">I LOVE YOU 3000 TIME.</div>
    </div>

    <div class="card">
      <div class="k"><span>今天的情话</span><span class="hearts">💗</span></div>
      <div class="quote" id="quote2">—</div>
    </div>

    <div class="card">
      <label class="lb">我想要朱景澈牢牢记住的事</label>
      <textarea id="memo" rows="4" placeholder="写下来，他就一定会记住"></textarea>
      <label class="lb">我不喜欢的事</label>
      <textarea id="dislike" rows="4" placeholder="不喜欢什么，都可以写"></textarea>
      <div style="margin-top:12px"><button class="btn" id="loveSend">写好了，让他知道</button></div>
      <div class="muted" id="loveTip"></div>
    </div>
  </section>

  <!-- ================= 消气 ================= -->
  <section class="view" id="view-anger">
    <div class="top-title">消气</div>

    <div class="card">
      <label class="lb">生气程度</label>
      <div class="levels" id="levels">
        <button data-lv="1"><span class="e">🙂</span>一点点</button>
        <button data-lv="2"><span class="e">😐</span>有点气</button>
        <button data-lv="3"><span class="e">😠</span>很生气</button>
        <button data-lv="4"><span class="e">🤯</span>超生气</button>
      </div>

      <label class="lb">因为什么事</label>
      <textarea id="angerText" rows="3" placeholder="什么事敢惹我姐姐生气!"></textarea>

      <label class="lb">要朱景澈做什么才能消气</label>
      <textarea id="angerWant" rows="2" placeholder="例如：现在打电话给我 / 买奶茶 / 不许再回消息慢"></textarea>

      <div style="margin-top:12px"><button class="btn" id="angerSend">发给他</button></div>
      <div class="muted" id="angerTip"></div>
    </div>

    <div class="card">
      <div class="k"><span>以前记过的</span><span id="angerCount"></span></div>
      <div id="angerList"></div>
    </div>
  </section>

  <!-- ================= 憨豆（桌宠） ================= -->
  <section class="view" id="view-pet">
    <div class="top-title">憨豆</div>

    <div class="pet-area" id="petArea">
      <div class="floor"></div>
      <div class="bubble" id="petSay">…</div>
      <div class="pet-wrap" id="petWrap">
        <div class="pet-anim" id="petAnim">
          <div class="pet-act" id="petAct">
            <div id="petSvg"></div>
            <!-- 眨眼眼皮（颜色=肤色，覆盖在眼睛上） -->
            <div class="eyelid" id="eyeL"></div>
            <div class="eyelid" id="eyeR"></div>
            <!-- 换装浮层（随身体一起动） -->
            <div class="lay hat" id="layHat"></div>
            <div class="lay glasses" id="layGlasses"></div>
            <div class="lay clothes" id="layClothes"></div>
            <div class="lay deco" id="layDeco"></div>
          </div>
        </div>
      </div>
      <div class="fx" id="fx"></div>
      <div class="poops" id="poops"></div>
    </div>

    <div class="bars">
      <div class="bar-box">
        <div class="n"><span>🍚 饱食度</span><span id="hungerN">—</span></div>
        <div class="bar-bg"><div class="bar-fill" id="hungerBar" style="width:0%"></div></div>
      </div>
      <div class="bar-box">
        <div class="n"><span>😊 心情</span><span id="happyN">—</span></div>
        <div class="bar-bg"><div class="bar-fill green" id="happyBar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="k"><span>和憨豆互动</span><span><span class="hearts">💗 <span id="heartsPet">0</span></span> <span id="heartBudgetPet" style="font-size:11.5px;color:#bb92a4"></span></span></div>
      <div class="row" style="margin-bottom:9px">
        <div class="col"><button class="btn small" id="feedBtn">🍚 喂食</button></div>
        <div class="col"><button class="btn small ghost" id="petBtn">✋ 摸摸头</button></div>
      </div>
      <div class="row">
        <div class="col"><button class="btn small ghost" id="playBtn">🎮 玩游戏</button></div>
        <div class="col"><button class="btn small ghost" id="cleanBtn">🧹 铲屎</button></div>
      </div>
    </div>

/* ============================================================
   江鑫颖姐姐的专属空间
   · 在一起的日子：START 为第 1 天，每天自动 +1
   · 推送：ntfy（免注册），备用 PushPlus/Server酱（?setup=1 填 token）
   ============================================================ */
const START = new Date(2026, 7, 30);        // 2026-08-30 = 第 1 天
const DAY_MS = 86400000;
const NTFY_TOPIC = 'jxy-love-2c2d8f7e9f5d';

/* ---------- 本地存储 ---------- */

  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

/* ---------- 天数 ---------- */
function daysTogether(now = new Date()) {
  const a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((b - a) / DAY_MS) + 1;
}
function renderDays() {
  const now = new Date();
  $('days').textContent = daysTogether(now);
  const ms = now - START;
  $('together').textContent = '已经 ' + Math.floor(ms / DAY_MS) + ' 天 '
    + Math.floor(ms % DAY_MS / 3600000) + ' 小时 ' + Math.floor(ms % 3600000 / 60000) + ' 分 '
    + Math.floor(ms % 60000 / 1000) + ' 秒';

}

/* ---------- 情话（第一句常驻，其余随机推送） ---------- */

/* ---------- 推送 ---------- */
function getToken() {
  if (PUSH.token) return PUSH.token;
  try { return localStorage.getItem('jxy_push_token') || ''; } catch (e) { return ''; }
}
function getType() {
  const t = getToken();
  if (t.startsWith('SCT')) return 'serverchan';
  try { return localStorage.getItem('jxy_push_type') || PUSH.type; } catch (e) { return PUSH.type; }
}
async function pushToHim(title, text) {
  try {
    const r = await fetch('https://ntfy.sh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: NTFY_TOPIC, title: title, message: text, tags: ['heart'] })
    });
    if (r.ok) return 'ntfy';
  } catch (e) { }
  const token = getToken();
  if (!token) return '';
  const type = getType();
  const form = document.createElement('form');
  form.method = 'POST'; form.target = 'pushFrame'; form.style.display = 'none';
  let action = '', fields = {};
  if (type === 'serverchan') {
    action = 'https://sctapi.ftqq.com/' + token + '.send';
    fields = { title: title, desp: text };
  } else {
    action = 'https://www.pushplus.plus/send';
    fields = { token: token, title: title, content: text.replace(/\n/g, '<br>'), template: 'html' };
  }
  form.action = action;
  Object.keys(fields).forEach((k) => {
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = fields[k];
    form.appendChild(i);
  });
  document.body.appendChild(form); form.submit();
  setTimeout(() => form.remove(), 1000);
  return 'form';
}
function stamp() {
  const n = new Date();
  return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
}

/* ============================================================

   也可手动强制归零：在网址后加 ?reset=1
   ============================================================ */
const RESET_TAG = 'hearts-0-2026-09-27';
const FORCE_RESET = new URLSearchParams(location.search).get('reset') === '1';
if (FORCE_RESET || LS.get('jxy_reset_tag', '') !== RESET_TAG) {

/* ============================================================
   爱心（每天最多 2 颗，所有来源共用这个额度）
   ============================================================ */
let hearts = LS.get('jxy_hearts', 0);
const HEART_CAP = 2;
function setHearts(v) {
  hearts = Math.max(0, Math.round(v));
  LS.set('jxy_hearts', hearts);
  ['heartsHome', 'heartsPet', 'heartsShop'].forEach((id) => { if ($(id)) $(id).textContent = hearts; });
}
function heartUsedToday() {
  const t = todayStr();
  const st = LS.get('jxy_heart_day', { d: t, used: 0 });
  return st.d === t ? Math.min(st.used, HEART_CAP) : 0;
}
function renderHeartBudget() {
  const used = heartUsedToday();
  const txt = '今日 ' + used + '/' + HEART_CAP;
  ['heartBudgetHome', 'heartBudgetPet'].forEach((id) => { if ($(id)) $(id).textContent = txt; });
}
function addHearts(n, why) {
  const t = todayStr();
  let st = LS.get('jxy_heart_day', { d: t, used: 0 });
  if (st.d !== t) st = { d: t, used: 0 };
  const give = Math.max(0, Math.min(n, HEART_CAP - st.used));
  if (give > 0) {
    st.used += give;
    LS.set('jxy_heart_day', st);
    setHearts(hearts + give);
    petFx('💗', 3);
    petSay('+' + give + ' 💗' + (why ? '（' + why + '）' : ''));
    beep(880, 0.1);
  } else {
    petSay('今天的爱心已经拿满啦，明天再赚～');
  }
  renderHeartBudget();
  return give;
}

/* ============================================================

   ============================================================ */
let petActTimer = null, lastTouch = Date.now(), sleeping = false, AC = null;

function beep(freq, dur) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur || 0.12));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.12));
  } catch (e) { }
}

/* 一次性动作：hop 跳 / squash 挤一下 / chew 咀嚼 / squat 蹲下拉屎 / shake 抖 / relieved 放松 */
function petAct(name, dur) {

  el.className = 'pet-act';
  void el.offsetWidth;
  if (name) el.classList.add('act-' + name);
  clearTimeout(petActTimer);
  petActTimer = setTimeout(() => { el.className = 'pet-act'; }, dur || 720);
}

/* 特效：在宠物区冒 emoji */
function petFx(chars, n, opt) {
  const box = $('fx');
  const area = $('petArea').getBoundingClientRect();
  const list = Array.isArray(chars) ? chars : [chars];
  for (let i = 0; i < (n || 1); i++) {
    const el = document.createElement('i');
    el.textContent = list[i % list.length];
    const x = area.width / 2 + (Math.random() * 90 - 45);
    const y = area.height * (opt && opt.fromPet ? 0.72 : 0.5) + (Math.random() * 20 - 10);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (16 + Math.random() * 12) + 'px';
    if (opt && opt.arc) {
      el.style.transition = 'transform 1.1s cubic-bezier(.2,.7,.4,1), opacity 1.1s ease';
      box.appendChild(el);
      requestAnimationFrame(() => {
        el.style.transform = 'translate(' + (opt.arc[0]) + 'px,' + (opt.arc[1]) + 'px) rotate(' + (Math.random() * 220 - 110) + 'deg)';
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 1200);
    } else {
      box.appendChild(el);
      el.classList.add('pop');
      setTimeout(() => el.remove(), 1000);
    }
  }
}

/* 胡萝卜飞进嘴里 */

    + (area.height - 96) + 'px;transition:transform .72s cubic-bezier(.35,.05,.4,1),opacity .25s .55s';
  $('fx').appendChild(el);

    const dx = (wrap.left + wrap.width / 2) - (area.left + area.width - 12);
    const dy = (wrap.top + wrap.height * 0.52) - (area.top + area.height - 82);
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.55)';
    el.style.opacity = '0';
  });
  setTimeout(() => el.remove(), 1000);
}

/* 待机：随机小动作；长时间没人理就睡觉 */
setInterval(() => {
  if (sleeping) return;

    sleeping = true;

  if (r < 0.38) { petAct('hop'); }
  else if (r < 0.62) { petAct('shake'); }
  else if (r < 0.82) { petFx(['✨', '💗', '🎵', '🌸'][Math.floor(Math.random() * 4)], 2); }
  else { petSay(randomPetLine()); }
}, 6500);

/* 到点拉屎：蹲一下 → 掉一坨 → 放松 */
function petPoopNow() {
  petAct('squat', 1250);
  petSay('嗯…等一下下');
  setTimeout(() => {
    petFx('💩', 1, { fromPet: true, arc: [Math.random() * 60 - 30, 34] });
    beep(300, 0.14);
    setTimeout(() => { petAct('relieved'); petSay('……刚刚那个不是我'); }, 420);
  }, 700);
}

/* 随时间衰减：饱食度每 20 分钟 -1；每 25 分钟拉一坨（最多 6 坨） */
function tickPet() {
  const now = Date.now();
  const mins = (now - pet.tHunger) / 60000;
  if (mins >= 1) {
    const dec = Math.floor(mins / 20);
    if (dec > 0) { pet.hunger = clamp(pet.hunger - dec, 0, 100); pet.tHunger = now; }
  }
  const pmins = (now - pet.tPoop) / 60000;
  if (pmins >= 25) {
    const add = Math.min(Math.floor(pmins / 25), 6 - pet.poop);
    if (add > 0) {
      pet.poop = clamp(pet.poop + add, 0, 6);
      pet.tPoop = now;
      if (!document.hidden) petPoopNow();       // 蹲下 → 掉一坨 → 放松
    }
  }
  // 饿久了心情下降
  if (pet.hunger < 20) pet.happy = clamp(pet.happy - 0.5, 0, 100);
  if (pet.poop >= 5) pet.happy = clamp(pet.happy - 0.5, 0, 100);
  savePet(); renderPet();
}
function savePet() { LS.set('jxy_pet', pet); }

/* 兔子本体（原创绘制：奶黄圆头长耳兔；按参考图的画风——粗描边、大眼高光、腮红斜线） */
function petSvg(mood) {
  const ink = '#4a3527', cream = '#fff7d6', inner = '#ffc2d6';

  const ears = ''
    + '<rect x="61" y="4" width="17" height="62" rx="8.5" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.6"/>'
    + '<rect x="66" y="13" width="7" height="44" rx="3.5" fill="' + inner + '"/>'
    + '<rect x="92" y="4" width="17" height="62" rx="8.5" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.6"/>'
    + '<rect x="97" y="13" width="7" height="44" rx="3.5" fill="' + inner + '"/>';

  const eyes = mood === 'happy'
    ? '<path d="M58 96 q9 -11 18 0" stroke="' + ink + '" stroke-width="4" fill="none" stroke-linecap="round"/>'
      + '<path d="M94 96 q9 -11 18 0" stroke="' + ink + '" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : mood === 'hungry'
      ? '<path d="M60 90 l16 16 M76 90 l-16 16" stroke="' + ink + '" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
        + '<path d="M94 90 l16 16 M110 90 l-16 16" stroke="' + ink + '" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
      : '<ellipse cx="68" cy="95" rx="7.6" ry="9.4" fill="' + ink + '"/>'
        + '<circle cx="65.4" cy="90.6" r="2.8" fill="#fff"/>'
        + '<ellipse cx="102" cy="95" rx="7.6" ry="9.4" fill="' + ink + '"/>'
        + '<circle cx="99.4" cy="90.6" r="2.8" fill="#fff"/>';

  const mouth = mood === 'happy'
    ? '<ellipse cx="85" cy="113" rx="8" ry="6.5" fill="#f07a9b" stroke="' + ink + '" stroke-width="2.6"/>'
    : '<ellipse cx="85" cy="107" rx="2.8" ry="2.2" fill="' + ink + '"/>'
      + '<path d="M78 111 q4 6 7 0" stroke="' + ink + '" stroke-width="2.8" fill="none" stroke-linecap="round"/>'
      + '<path d="M85 111 q4 6 7 0" stroke="' + ink + '" stroke-width="2.8" fill="none" stroke-linecap="round"/>';

  const blush = (x) => '<ellipse cx="' + x + '" cy="108" rx="9.5" ry="6.2" fill="#ffb3c9"/>'
    + '<path d="M' + (x - 4) + ' 105 l0 6 M' + x + ' 105 l0 6 M' + (x + 4) + ' 105 l0 6" stroke="#f07a9b" stroke-width="1.6" stroke-linecap="round"/>';

  return '<svg viewBox="0 0 170 170" aria-hidden="true">'
    + ears
    // 身体 / 小手 / 脚 / 尾巴
    + '<ellipse cx="85" cy="150" rx="27" ry="20" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.6"/>'
    + '<path d="M52 138 q-13 -7 -16 1 q6 8 16 6 Z" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.2"/>'
    + '<path d="M118 138 q13 -7 16 1 q-6 8 -16 6 Z" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.2"/>'
    + '<ellipse cx="70" cy="164" rx="9" ry="5.4" fill="' + cream + '" stroke="' + ink + '" stroke-width="3"/>'
    + '<ellipse cx="100" cy="164" rx="9" ry="5.4" fill="' + cream + '" stroke="' + ink + '" stroke-width="3"/>'
    + '<circle cx="114" cy="158" r="6.4" fill="#fffdf5" stroke="' + ink + '" stroke-width="2.8"/>'
    // 头（大圆头）
    + '<ellipse cx="85" cy="94" rx="53" ry="47" fill="' + cream + '" stroke="' + ink + '" stroke-width="3.8"/>'
    + blush(54) + blush(116)
    + eyes + mouth
    + '</svg>';
}

function renderPet() {
  $('hungerN').textContent = Math.round(pet.hunger) + '%';
  $('happyN').textContent = Math.round(pet.happy) + '%';
  $('hungerBar').style.width = pet.hunger + '%';
  $('happyBar').style.width = pet.happy + '%';

  // 表情：饿了 → 饿肚子脸；心情好 → 笑眼；否则普通大眼
  const moodKey = pet.hunger < 30 ? 'hungry' : (pet.happy > 75 ? 'happy' : 'normal');
  if (!window.__userPet) $('petSvg').innerHTML = petSvg(moodKey);   // 若放了 pet.png 则优先显示自定义形象

  $('layHat').textContent = (SHOP.find((s) => s.id === pet.hat) || {}).e || '';
  $('layGlasses').textContent = (SHOP.find((s) => s.id === pet.glasses) || {}).e || '';
  $('layClothes').textContent = (SHOP.find((s) => s.id === pet.clothes) || {}).e || '';
  $('layDeco').textContent = (SHOP.find((s) => s.id === pet.deco) || {}).e || '';

  const box = $('poops');
  box.innerHTML = '';
  for (let i = 0; i < pet.poop; i++) {
    const s = document.createElement('span');
    s.className = 'poop';
    s.textContent = '💩';
    s.style.transform = 'rotate(' + (Math.random() * 20 - 10) + 'deg)';
    box.appendChild(s);
  }

  const mood = pet.poop >= 4 ? '有点臭臭的 😷' : pet.hunger < 30 ? '饿了 🥺' : pet.happy > 75 ? '超开心 😊' : '还不错 🙂';
  $('petMood').textContent = mood;
  $('petBrief').innerHTML = '饱食度 ' + Math.round(pet.hunger) + '% · 心情 ' + Math.round(pet.happy) + '%<br>'
    + '地上有 ' + pet.poop + ' 坨便便' + (pet.poop ? '（记得铲）' : '（很干净）');

  // 商店
  const shop = $('shop');
  shop.innerHTML = '';
  SHOP.forEach((it) => {
    const owned = it.p === 0 || pet.own.includes(it.id);
    const on = pet[it.slot] === it.id;
    const d = document.createElement('div');
    d.className = 'shop-item' + (owned ? ' owned' : '') + (on ? ' on' : '');
    d.innerHTML = '<div class="e">' + it.e + '</div><div class="nm">' + it.n + '</div>'
      + '<div class="pr">' + (owned ? (on ? '已穿上' : '点击穿上') : it.p + ' 💗') + '</div>';
    d.addEventListener('click', () => {
      if (!owned) {
        if (hearts < it.p) { petSay('爱心不够啦，去喂我/铲屎/签到赚一点'); return; }
        setHearts(hearts - it.p);
        pet.own.push(it.id); savePet();
        petSay('谢谢姐姐！' + it.n + ' 收到 🎁');
      } else {
        pet[it.slot] = on ? '' : it.id;
        savePet();
        petSay(on ? ('把' + it.n + '脱下来了') : ('戴上' + it.n + '好看吗？'));
      }
      renderPet();
    });
    shop.appendChild(d);
  });
}

/* 互动 */
$('feedBtn').addEventListener('click', () => {
  if (pet.hunger >= 95) { petWake(); petSay('憨豆吃不下啦，肚子圆圆的'); petAct('shake'); return; }
  petWake();
  flyCarrot();                                  // 胡萝卜飞过来
  petAct('chew', 760);                          // 咀嚼
  setTimeout(() => petAct('hop'), 800);         // 吃完开心跳一下
  pet.hunger = clamp(pet.hunger + 35, 0, 100);
  pet.happy = clamp(pet.happy + 8, 0, 100);
  pet.feeds++;
  setTimeout(() => { addHearts(1, '喂食'); petSay(['好吃！谢谢姐姐', '憨豆最喜欢姐姐喂的', '吃饱饱～'][Math.floor(Math.random() * 3)]); savePet(); renderPet(); }, 760);
  savePet(); renderPet();
});
$('petBtn').addEventListener('click', () => {
  petWake();
  pet.happy = clamp(pet.happy + 4, 0, 100);
  petAct('squash');
  petFx('💗', 2);
  petSay(randomPetLine());
  beep(700, 0.1);
  savePet(); renderPet();
});
$('cleanBtn').addEventListener('click', () => {
  if (!pet.poop) { petWake(); petSay('地上很干净，不用铲啦'); return; }
  petWake();
  const n = pet.poop;
  document.querySelectorAll('#poops .poop').forEach((el, i) => {   // 便便飞走
    el.style.transition = 'transform .62s ease, opacity .62s ease';
    el.style.transform = 'translate(' + (-60 - i * 18) + 'px, 52px) rotate(' + (140 + i * 30) + 'deg)';
    el.style.opacity = '0';
  });
  petAct('hop');
  beep(520, 0.12);
  setTimeout(() => {
    pet.poop = 0; pet.tPoop = Date.now();
    pet.happy = clamp(pet.happy + 6, 0, 100);
    pet.cleans++;
    addHearts(n, '铲屎');
    savePet(); renderPet();
  }, 640);
});

/* 猜拳 */
$('playBtn').addEventListener('click', () => { $('rpsModal').classList.add('on'); $('rpsRes').textContent = ''; });
$('rpsClose').addEventListener('click', () => $('rpsModal').classList.remove('on'));
document.querySelectorAll('.rps button').forEach((b) => {
  b.addEventListener('click', () => {
    const me = b.dataset.rps;
    const all = ['石头', '剪刀', '布'];
    const petPick = all[Math.floor(Math.random() * 3)];
    win = (me === '石头' && petPick === '剪刀') || (me === '剪刀' && petPick === '布') || (me === '布' && petPick === '石头');
    const draw = me === petPick;
    pet.plays++;
    petWake();
    if (win) { pet.happy = clamp(pet.happy + 10, 0, 100); petAct('hop'); petFx(['🎉', '✨', '💗'], 3); beep(880, 0.12); }
    else if (!draw) { pet.happy = clamp(pet.happy + 2, 0, 100); petAct('shake'); }
    else { petAct('squash'); }
    $('rpsRes').textContent = '你出' + me + '，憨豆出' + petPick + ' → ' + (win ? '你赢啦！憨豆开心得转圈 🎉' : draw ? '平局～再来' : '憨豆赢了（憨豆偷偷开心）');
    savePet(); renderPet();
  });
});

/* 爱说话 */
setInterval(() => { if (document.getElementById('view-pet').classList.contains('on')) petSay(randomPetLine()); }, 22000);

/* ============================================================
   启动
   ============================================================ */
setHearts(hearts);
renderDays(); renderQuote(); renderCheckin(); renderAnger(); renderHeartBudget();
petSay(randomPetLine()); renderPet();

/* 若目录里放了 pet.png，就用它作为宠物形象（你自己提供的图片） */
(function probeUserPet() {
  const im = new Image();
  im.onload = () => {
    window.__userPet = true;
    $('petSvg').innerHTML = '<img src="pet.png" alt="pet" style="width:100%;height:100%;object-fit:contain">';
  };
  im.src = 'pet.png';
})();

tickPet();
setInterval(renderDays, 1000);
setInterval(tickPet, 60000);
setInterval(renderQuote, 60000);

/* 打开时按 #tab 定位；支持 ?setup=1 填 token */
(function init() {
  const h = (location.hash || '').replace('#', '');
  if (['home', 'love', 'anger', 'pet'].includes(h)) showTab(h);
  if (new URLSearchParams(location.search).get('setup') === '1') {
    const t = prompt('粘贴推送 token（PushPlus 的 token 或 Server酱 的 SCT 开头 SendKey）：', getToken());
    if (t !== null) {
      const v = t.trim();
      try { localStorage.setItem('jxy_push_token', v); localStorage.setItem('jxy_push_type', v.startsWith('SCT') ? 'serverchan' : 'pushplus'); } catch (e) { }
      alert('已保存');
    }
  }
})();

/* ============================================================
   背景音乐（浏览器规定必须由用户点一下才能出声）
   ============================================================ */
const bgm = $('bgm'), musicBtn = $('musicBtn');
/* 音源：CDN 优先（对国内网络快 5 倍以上），拿不到就自动切回仓库里的文件 */
const BGM_SOURCES = [
  'https://cdn.jsdelivr.net/gh/zhujingche/love@7270dc5826381d253939933f122cb882aa80bedc/bgm.mp3',
  'bgm.mp3',
  'bgm.wav'
];
let bgmSrcIdx = 0, bgmWanted = LS.get('jxy_bgm', 'on') === 'on', bgmStarted = false;
let bgmGotData = false;                      // CDN 只要开始下载就不要换源（否则会切到更慢的源）
bgm.src = BGM_SOURCES[0];

function nextBgmSource() {
  if (bgmSrcIdx >= BGM_SOURCES.length - 1) return false;
  bgmSrcIdx++;
  const wasPlaying = !bgm.paused;
  bgmGotData = false;
  bgm.src = BGM_SOURCES[bgmSrcIdx];
  bgm.load();
  if (wasPlaying && bgmWanted) { bgmStarted = false; startBgm(); }
  return true;
}
bgm.addEventListener('progress', () => { bgmGotData = true; });
bgm.addEventListener('loadedmetadata', () => { bgmGotData = true; });
/* 只有「完全没有数据」持续约 21 秒才换下一个源 */
setInterval(() => {
  if (!bgmStarted && bgmWanted && !bgmGotData && !(bgm.duration > 0)) {
    if (bgm._slowTicks === undefined) bgm._slowTicks = 0;
    if (++bgm._slowTicks >= 6) { bgm._slowTicks = 0; nextBgmSource(); }
  }
}, 3500);
bgm.addEventListener('error', () => { nextBgmSource(); });

function paintMusic() {
  const playing = !bgm.paused;                 // 只要没暂停就算在播
  musicBtn.textContent = playing ? '🎵' : '🔇';
  musicBtn.classList.toggle('playing', playing);
  musicBtn.classList.toggle('off', !bgmWanted && !playing);
}
function fadeIn() {
  let v = 0;
  bgm.volume = 0;
  clearInterval(bgm._fade);
  bgm._fade = setInterval(() => {
    v = Math.min(0.45, v + 0.03);
    bgm.volume = v;
    if (v >= 0.45) clearInterval(bgm._fade);
  }, 60);
}
function startBgm() {
  if (!bgmWanted || bgmStarted) return;
  const p = bgm.play();
  if (p && p.then) {
    p.then(() => { bgmStarted = true; fadeIn(); paintMusic(); })
      .catch(() => {
        if (bgm.networkState === 3 || bgm.error) { musicBtn.style.display = 'none'; }  // 没有音频文件
        paintMusic();
      });
  }
}
musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (bgm.paused) {                     // 点一下 → 播放
    bgmWanted = true;
    LS.set('jxy_bgm', 'on');
    bgmStarted = false;
    startBgm();
  } else {                              // 再点一下 → 暂停
    bgmWanted = false;
    LS.set('jxy_bgm', 'off');
    bgm.pause();
    bgmStarted = false;
  }
  paintMusic();
  beep(bgmWanted ? 660 : 440, 0.08);
});
bgm.addEventListener('play', paintMusic);
bgm.addEventListener('playing', paintMusic);
bgm.addEventListener('pause', paintMusic);
/* 双保险：即使浏览器没有遵守 loop，播完也立刻从头再来 */
bgm.addEventListener('ended', () => {
  if (!bgmWanted) return;
  try { bgm.currentTime = 0; } catch (e) { }
  bgm.play().catch(() => { });
});
/* 播到一半被系统暂停（切后台/锁屏）时，回到前台继续 */
bgm.addEventListener('stalled', () => { if (bgmWanted) setTimeout(() => startBgm(), 1200); });
/* 首次任意点击/触摸 → 尝试播放；未成功则下次点击再试 */
window.addEventListener('pointerdown', () => startBgm(), { passive: true });
window.addEventListener('touchstart', () => startBgm(), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && bgmWanted) startBgm(); });
paintMusic();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
